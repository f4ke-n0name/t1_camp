version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: github_postgres
    restart: always
    environment:
      POSTGRES_DB: {DB_NAME}
      POSTGRES_USER: {DB_USER}
      POSTGRES_PASSWORD: {DB_PASSWORD}
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
